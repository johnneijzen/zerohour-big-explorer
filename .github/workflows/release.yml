name: Release on tag

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  
jobs:
  build_big_cli_linux:
    name: Build big-cli (linux-musl)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Cache cargo registry
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5.0.5
        with:
          path: |
            target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools xz-utils
          rustup target add x86_64-unknown-linux-musl

      - name: Build big-cli (musl)
        run: |
          cargo build --manifest-path big-cli/Cargo.toml --release --target x86_64-unknown-linux-musl

      - name: Package big-cli (linux)
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/big-cli
          mkdir -p release
          strip "$BIN" || true
          cp "$BIN" release/big-cli-linux
          cd release && zip -r ../big-cli-linux.zip . && cd ..

      - name: Upload big-cli-linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: big-cli-linux
          path: big-cli-linux.zip

  build_big_cli_windows:
    name: Build big-cli (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Cache cargo registry (windows)
        uses: actions/cache@v5.0.5
        with:
          path: |
            %USERPROFILE%/.cargo/registry
            %USERPROFILE%/.cargo/git
            C:\\Users\\runneradmin\\.cargo\\registry
            C:\\Users\\runneradmin\\.cargo\\git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build (windows)
        uses: actions/cache@v5.0.5
        with:
          path: |
            target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build big-cli (windows)
        run: |
          cargo build --manifest-path big-cli/Cargo.toml --release

      - name: Package big-cli (windows)
        run: |
          $bin = "target\release\big-cli.exe"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $bin -Destination release\big-cli.exe
          cd release; Compress-Archive -Path * -DestinationPath ..\big-cli-windows.zip; cd ..

      - name: Upload big-cli-windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: big-cli-windows
          path: big-cli-windows.zip

  build_big_tauri:
    name: Build big-tauri (linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf libfuse2 xdg-utils

      - name: Cache cargo registry
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5.0.5
        with:
          path: |
            target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install frontend deps
        run: |
          cd big-tauri
          pnpm install --frozen-lockfile || pnpm install

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable


      - name: Build Tarui App (linux)
        env:
          NO_STRIP: "true"
        run: |
          cd big-tauri
          pnpm build
          pnpm tauri build --verbose --target x86_64-unknown-linux-gnu --bundles deb,appimage || true

      - name: Package big-tauri output
        run: |
          cd big-tauri
          mkdir -p release
          # Robustly search and collect AppImage / deb bundles from likely target locations
          CANDIDATES=("target" "../target" "target/x86_64-unknown-linux-gnu/release/bundle" "../target/x86_64-unknown-linux-gnu/release/bundle")
          for P in "${CANDIDATES[@]}"; do
            if [ -d "$P" ]; then
              find "$P" -maxdepth 6 -type f \( -iname "*.AppImage" -o -iname "*.deb" \) -print -exec cp -f {} release/ \; || true
            fi
          done

          if [ -n "$(ls -A release 2>/dev/null)" ]; then
            zip -r ../big-tauri-linux.zip release || true
          else
            echo "No bundles found in expected targets; attempting repo-wide search and packaging placeholder"
            find .. -maxdepth 6 -type f \( -iname "*.AppImage" -o -iname "*.deb" \) -print -exec cp -f {} release/ \; || true
            if [ -n "$(ls -A release 2>/dev/null)" ]; then
              zip -r ../big-tauri-linux.zip release || true
            else
              echo "tauri build failed on CI; no artifacts produced." > release/README.txt
              zip -r ../big-tauri-linux.zip release || true
            fi
          fi

      - name: Upload big-tauri artifact
        uses: actions/upload-artifact@v7
        with:
          name: big-tauri-linux
          path: big-tauri-linux.zip

  build_big_tauri_windows:
    name: Build big-tauri (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Cache cargo registry (windows)
        uses: actions/cache@v5.0.5
        with:
          path: |
            %USERPROFILE%/.cargo/registry
            %USERPROFILE%/.cargo/git
            C:\\Users\\runneradmin\\.cargo\\registry
            C:\\Users\\runneradmin\\.cargo\\git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build (windows)
        uses: actions/cache@v5.0.5
        with:
          path: |
            target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install frontend deps
        run: |
          cd big-tauri
          pnpm install --frozen-lockfile || pnpm install

      - name: Setup Rust for tauri (MSVC)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Build big-tauri (windows)
        shell: powershell
        continue-on-error: true
        env:
          NO_STRIP: 'true'
        run: |
          cd big-tauri
          pnpm build
          pnpm tauri build

      - name: Package big-tauri output (windows)
        shell: powershell
        run: |
          cd big-tauri
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $candidates = @(
            "target\release\bundle",
            "..\target\release\bundle",
            "..\target\x86_64-pc-windows-msvc\release\bundle",
            "..\target\release\bundle"
          )
          $copied = $false
          foreach ($p in $candidates) {
            if (Test-Path $p) {
              Get-ChildItem -Path $p -Recurse -File | ForEach-Object { Copy-Item $_.FullName -Destination release -Force }
              $copied = $true
            }
          }
          if (-not $copied) {
            Write-Host "No target bundle found in expected paths; attempting broader repo search"
            $matches = Get-ChildItem -Path .. -Recurse -File -Include *.msi,*.exe,*.zip,*.AppImage -ErrorAction SilentlyContinue
            foreach ($m in $matches) { Copy-Item $m.FullName -Destination release -Force }
          }
          Compress-Archive -Path release\* -DestinationPath ..\big-tauri-windows.zip

      - name: Upload big-tauri-windows
        uses: actions/upload-artifact@v7
        with:
          name: big-tauri-windows
          path: big-tauri-windows.zip

  create_release:
    name: Create GitHub release and upload artifacts
    runs-on: ubuntu-latest
    needs: [build_big_cli_linux, build_big_cli_windows, build_big_tauri, build_big_tauri_windows]
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download big-cli linux artifact
        uses: actions/download-artifact@v7 
        with:
          name: big-cli-linux

      - name: Download big-cli windows artifact
        uses: actions/download-artifact@v7 
        with:
          name: big-cli-windows

      - name: Download big-tauri artifact
        uses: actions/download-artifact@v7 
        with:
          name: big-tauri-linux

      - name: Download big-tauri windows artifact
        uses: actions/download-artifact@v7 
        with:
          name: big-tauri-windows

      - name: Create Release and upload assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "Automated release for tag ${{ github.ref_name }}: big-cli and big-tauri artifacts"
          artifacts: "big-cli-linux.zip,big-cli-windows.zip,big-tauri-linux.zip,big-tauri-windows.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
